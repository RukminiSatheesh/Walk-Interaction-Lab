<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A complete HTML document with an external CSS stylesheet</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* YOUR ORIGINAL STYLES — unchanged */

        body {
            color: blue;
            --page-color: grey;
        }

        a {
            color: blue;
        }


        /* ==============================
           ANIMATION ONLY
           ============================== */

        .pattern-container {
            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100vw !important;
            height: 100vh !important;

            margin: 0 !important;
            padding: 0 !important;

            overflow: hidden;

            z-index: -1;

            pointer-events: none;
        }

        .pattern-mover {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-image: url('Animation Waves.png');
            background-repeat: repeat;
            background-size: auto 100%;
            background-position: 0 center;

            animation: movePatternRight 15s linear infinite;

            pointer-events: none;
        }

        @keyframes movePatternRight {

            0% {
                background-position-x: 0%;
            }

            100% {
                background-position-x: 100%;
            }

        }

    </style>
</head>


<body>

    <!-- ANIMATION LAYER ONLY -->
    <div class="pattern-container">
        <div class="pattern-mover"></div>
    </div>


    <!-- YOUR EXISTING CONTENT -->
