<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>301 1st Ave</title>

    <link rel="stylesheet" href="style.css">

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            color: darkblue;
            background-color: white;

            /* Your wave image is now THE BACKGROUND */
            background-image: url("Animation Waves.png");
            background-repeat: repeat;
            background-size: auto 100%;
            background-position: 0 center;

            animation: moveWaves 15s linear infinite;
        }

        @keyframes moveWaves {
            from {
                background-position: 0 center;
            }

            to {
                background-position: 100% center;
            }
        }

        a {
            color: darkblue;
        }

    </style>
</head>

<body>

    <h1>301 1st Ave</h1>

    <h1>
        <a href="301 1st Ave.html">
            👉 do you wanna go on a walk with me?
        </a>
    </h1>

</body>
</html>
