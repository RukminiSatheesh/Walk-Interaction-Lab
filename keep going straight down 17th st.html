<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>A complete HTML document with an external CSS stylesheet</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            color: lightgrey;
            --page-color: rgb(39, 59, 77);
        }

        a {
            color: lightgrey;
        }


        /* WAVE ANIMATION ONLY */

        .pattern-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .pattern-mover {
            width: 100%;
            height: 100%;

            background-image: url('Animation Waves.png');
            background-repeat: repeat;
            background-size: auto 100%;
            background-position: 0px center;

            animation: movePatternRight 15s linear infinite;

            pointer-events: none;
        }

        @keyframes movePatternRight {
            0% {
                background-position-x: 0%;
            }

            100% {
                background-position-x: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="water-text">

        <h3>someone asks us for directions to Target</h3>
        <h3>homeless man is screaming</h3>
        <h3>hot guy brushes past me</h3>

        <p>"OKAYY, I SAW THAT"</p>
        <p>*smiling*</p>

    </div>

    <h1>
        <a href="go straight down 17th some more.html">
            👉 go straight down 17th some more
        </a>
    </h1>


    <!-- WAVE ANIMATION -->
    <div class="pattern-container">
        <div class="pattern-mover"></div>
    </div>

</body>
</html>
