<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>A complete HTML document with an external CSS stylesheet</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            color: lightgrey;
            --page-color: blue;
        }

        a {
            color: lightgrey;
        }


        /* =========================
           WAVE ANIMATION ONLY
           ========================= */

        .pattern-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;
        }

        .pattern-mover {
            width: 100%;
            height: 100%;

            background-image: url('Animation Waves.png');
            background-repeat: repeat;
            background-size: auto 100%;
            background-position: 0px center;

            animation: movePatternRight 15s linear infinite;

            pointer-events: none;
        }

        @keyframes movePatternRight {
            0% {
                background-position-x: 0%;
            }

            100% {
                background-position-x: 100%;
            }
        }
    </style>

</head>

<body>

    <div class="water-text">

        <h3>rich buildings, everything is reflective</h3>

        <h3>lots of shirtless people running</h3>

        <h3>ice cream truck that has words printed on it that look like they're written in sand</h3>

        <p>"I legit thought they wrote with sand on that truck"</p>

        <p>"how are you that dumb?"</p>

    </div>


    <h1>
        <a href="turn right onto the Hudson River Greenway, Pier 57.html">
            👉 turn right onto the Hudson River Greenway, Pier 57
        </a>
    </h1>


    <!-- WAVE ANIMATION -->
    <div class="pattern-container">
        <div class="pattern-mover"></div>
    </div>

</body>

</html>
