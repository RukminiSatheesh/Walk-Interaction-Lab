<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>A complete HTML document with an external CSS stylesheet</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            color: lightblue;
            --page-color: rgb(59, 59, 59);
        }

        a {
            color: lightblue;
        }


        /* =========================
           WAVE ANIMATION ONLY
           ========================= */

        .pattern-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;

            overflow: hidden;

            pointer-events: none;
        }

        .pattern-mover {
            width: 100%;
            height: 100%;

            background-image: url('Animation Waves.png');
            background-repeat: repeat;
            background-size: auto 100%;
            background-position: 0 center;

            animation: movePatternRight 15s linear infinite;

            pointer-events: none;
        }

        @keyframes movePatternRight {
            0% {
                background-position-x: 0%;
            }

            100% {
                background-position-x: 100%;
            }
        }
    </style>
</head>


<body>

    <div class="water-text">
        <h3>subway steam hot on our pants</h3>

</body>

</html>
