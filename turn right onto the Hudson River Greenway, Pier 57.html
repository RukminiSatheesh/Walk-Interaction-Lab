<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>A complete HTML document with an external CSS stylesheet</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            color: lightgrey;
            --page-color: darkblue;
        }

        a {
            color: lightgrey;
        }


        /* =========================
           WAVE ANIMATION ONLY
           ========================= */

        .pattern-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;
        }

        .pattern-mover {
            width: 100%;
            height: 100%;

            background-image: url('Animation Waves.png');
            background-repeat: repeat;
            background-size: auto 100%;
            background-position: 0px center;

            animation: movePatternRight 15s linear infinite;

            pointer-events: none;
        }

        @keyframes movePatternRight {
            0% {
                background-position-x: 0%;
            }

            100% {
                background-position-x: 100%;
            }
        }
    </style>

</head>

<body>

    <div class="water-text">

        <h3>WATER</h3>
        <H2>WATER</H2>
        <H1>WATER</H1>

        <p>"ended up at the pier again"</p>
        <p>"of course we did, we always do"</p>

    </div>


    <a href="index.html">👉 THAT WAS A GREAT WALK</a>


    <!-- WAVE ANIMATION ONLY -->
    <div class="pattern-container">
        <div class="pattern-mover"></div>
    </div>

</body>

</html>
